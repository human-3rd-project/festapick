# Local-only URL defaults. Secrets are still required through backend/festapick/.env.
frontend.url=${FRONTEND_URL:http://localhost:8111}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festapick?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8111/oauth/kakao/callback}
server.forward-headers-strategy=none
