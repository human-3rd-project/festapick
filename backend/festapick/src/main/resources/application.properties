server.port=${SERVER_PORT:8111}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:.env[.properties]

# External URLs
frontend.url=${FRONTEND_URL}

# MySQL DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT (Base64-encoded secret; use at least 64 random bytes for HS512)
jwt.secret=${JWT_SECRET}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.default-flat-param-object=true

# Tour API
tourapi.service-key=${TOUR_API_SERVICE_KEY}
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.sync-on-startup=true

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/

# Toss Payments
toss.payments.secret-key=${TOSS_SECRET_KEY}
toss.payments.confirm-url=${TOSS_CONFIRM_URL}

# Kakao
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
firebase.upload-base-path=${FIREBASE_UPLOAD_BASE_PATH:uploads}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
