# Test database
spring.datasource.url=jdbc:h2:mem:festapick;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create a clean schema for every test execution
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Do not call external APIs when the Spring test context starts
tourapi.sync-on-startup=false

# Test-only URLs
frontend.url=http://localhost:8111
kakao.redirect-uri=http://localhost:8111/oauth/kakao/callback

# Test-only credentials
jwt.secret=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+Pw==
tourapi.service-key=test-tour-api-key
gemini.api-key=test-gemini-api-key
toss.payments.secret-key=test-toss-secret-key
toss.payments.confirm-url=https://example.com/toss/confirm
kakao.client-id=test-kakao-client-id
spring.mail.username=test@example.com
spring.mail.password=test-password

# Firebase beans are mocked in FestapickApplicationTests,
# but the property placeholders still require values.
firebase.project-id=test-project
firebase.storage.bucket=test-bucket
firebase.credentials.path=test-firebase-credentials.json
firebase.upload-base-path=test-uploads
